
x-airflow-common:
  &airflow-common
  image: job-crawler-airflow:latest
  build:
    context: ../..
    dockerfile: docker/airflow/Dockerfile
  env_file:
    - .env  # optional: place AIRFLOW__ vars here
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__WEBSERVER__RBAC: "True"
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: UTC
    CRAWLER_HOME: /opt/airflow/jobs/job_crawler_system
  volumes:
    - ../../dags:/opt/airflow/dags
    - ../../logs:/opt/airflow/logs
    - ../../plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata-airflow:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  scheduler:
    <<: *airflow-common
    command: scheduler

  webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"

volumes:
  pgdata-airflow:
